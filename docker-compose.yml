version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-enterprise_secure_jwt_fallback_key}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend/nexus.db:/app/backend/nexus.db
    depends_on:
      - qdrant
    networks:
      - nexus_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - nexus_net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nexus_net

volumes:
  qdrant_data:

networks:
  nexus_net:
    driver: bridge
