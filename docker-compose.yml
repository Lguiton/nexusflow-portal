version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nexusflow_db
    restart: always
    environment:
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: nexus_secure_password
      POSTGRES_DB: nexusflow_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexusflow_cache
    ports:
      - "6379:6379"

volumes:
  postgres_data:
